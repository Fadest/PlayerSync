services:
  mongo:
    image: mongo:7
    container_name: playersync-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: playersync
      MONGO_INITDB_ROOT_PASSWORD: playersync
  redis:
    image: redis:7-alpine
    container_name: playersync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  mongo-express:
    image: mongo-express:1.0.2
    container_name: playersync-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://playersync:playersync@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo-data:
